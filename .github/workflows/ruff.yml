name: Code check

on:
    push:
    pull_request:

jobs:
    ruff:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            
            - name: Ruff check
              uses: astral-sh/ruff-action@v4.1.0
              with:
                args: "check --show-fixes --exit-zero"
                src: "./src"


            
