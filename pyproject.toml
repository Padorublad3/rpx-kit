[build-system]
requires = ["hatchling","uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "rpx-kit"
description = "Toolkit for Ren'Py RPA 3.0 archives" 
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Padorublad3"},
]
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.scripts]
rpx-kit = "rpx_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rpx_kit"]

